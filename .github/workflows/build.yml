name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai progetto dallo zip
        run: |
          if [ -f IptvLite.zip ]; then
            unzip -q -o IptvLite.zip
          fi
          if [ -d IptvLite ]; then
            cp -r IptvLite/. .
            rm -rf IptvLite
          fi
          echo "Contenuto progetto:"
          ls -la
          test -f settings.gradle.kts || { echo "settings.gradle.kts mancante"; exit 1; }
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts mancante"; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk IptvLite.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IPTV Lite build ${{ github.run_number }}
          files: IptvLite.apk
          make_latest: true