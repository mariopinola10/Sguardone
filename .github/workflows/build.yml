name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai progetto dallo zip
        run: |
          # Prende il primo .zip presente, qualunque sia il nome
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Estraggo: $ZIP"
            unzip -q -o "$ZIP" -d _src
            ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
            if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
              echo "settings.gradle.kts non trovato nello zip"; exit 1
            fi
            cp -r "$ROOT"/. .
            rm -rf _src
          fi
          test -f settings.gradle.kts || { echo "settings.gradle.kts mancante"; exit 1; }
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts mancante"; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Sguardone.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sguardone build ${{ github.run_number }}
          files: Sguardone.apk
          make_latest: true

      - name: Prepara sito con l'APK
        run: |
          mkdir -p site
          cp Sguardone.apk site/Sguardone.apk
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "?")
          cat > site/index.html <<EOF
          <!doctype html><html lang="it"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>Sguardone</title></head>
          <body style="font-family:sans-serif;background:#0b1d3f;color:#fff;text-align:center;padding:40px">
          <h1>Sguardone</h1><p>Versione $VERSION · build ${{ github.run_number }}</p>
          <p><a style="color:#8ccbff;font-size:22px" href="Sguardone.apk">Scarica Sguardone.apk</a></p>
          </body></html>
          EOF

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
