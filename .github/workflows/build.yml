name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # serve la cronologia per sapere quando è stato caricato ogni zip

      - name: Estrai progetto dallo zip più recente
        run: |
          # 1) Se ci sono zip con la versione nel nome (es. "Sguardone-0.21.0.zip") prende la versione più alta.
          # 2) Altrimenti: lo zip con il versionCode più alto all'interno; a parità, quello caricato per ultimo.
          # I vecchi zip possono restare nel repository e si cancellano quando vuoi.
          shopt -s nullglob
          BEST=$(ls -1 *.zip 2>/dev/null | grep -E '^Sguardone-[0-9]+(\.[0-9]+)*\.zip$' | sort -V | tail -n 1 || true)
          if [ -n "$BEST" ]; then
            echo "Zip con versione nel nome:"; ls -1 *.zip | grep -E '^Sguardone-[0-9]' | sort -V | sed 's/^/  /'
          else
            BEST_VC=-1; BEST_T=-1
            for Z in *.zip; do
              VC=$(unzip -p "$Z" '*app/build.gradle.kts' 2>/dev/null | grep -oP 'versionCode\s*=\s*\K[0-9]+' | head -n 1)
              VC=${VC:-0}
              T=$(git log -1 --format=%ct -- "$Z" 2>/dev/null)
              T=${T:-0}
              echo "  $Z  -> versionCode $VC, caricato $(date -d @$T '+%F %T' 2>/dev/null)"
              if [ "$VC" -gt "$BEST_VC" ] || { [ "$VC" -eq "$BEST_VC" ] && [ "$T" -gt "$BEST_T" ]; }; then
                BEST="$Z"; BEST_VC=$VC; BEST_T=$T
              fi
            done
          fi
          if [ -n "$BEST" ]; then
            echo "Compilo: $BEST"
            unzip -q -o "$BEST" -d _src
            ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
            if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
              echo "settings.gradle.kts non trovato nello zip"; exit 1
            fi
            cp -r "$ROOT"/. .
            rm -rf _src
          fi
          test -f settings.gradle.kts || { echo "settings.gradle.kts mancante"; exit 1; }
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts mancante"; exit 1; }

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Compila APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Sguardone.apk

      # version.json: lo legge il pulsante "Aggiorna" dell'app (versione + impronta SHA-256 dell'APK)
      - name: Crea version.json
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          SHA=$(sha256sum Sguardone.apk | cut -d' ' -f1)
          APK="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Sguardone.apk"
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s","apk":"%s"}\n' "$VC" "$VN" "$SHA" "$APK" > version.json
          cat version.json

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sguardone ${{ github.run_number }}
          files: |
            Sguardone.apk
            version.json
          make_latest: true

      - name: Prepara pagina download
        run: |
          mkdir -p site
          cp Sguardone.apk version.json site/
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          cat > site/index.html <<EOF
          <!doctype html><html lang="it"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1"><title>Sguardone</title></head>
          <body style="font-family:sans-serif;background:#0f1318;color:#fff;padding:24px">
          <h1>Sguardone $VN</h1>
          <p><a style="color:#7fa7ff;font-size:20px" href="Sguardone.apk">Scarica Sguardone.apk</a></p>
          </body></html>
          EOF

      - name: Carica pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
